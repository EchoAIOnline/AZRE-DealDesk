
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AZRE DealDesk</title>
    <!-- Plus Jakarta Sans & JetBrains Mono Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Added typography plugin -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              // Deep slate navy palette: #172235 for raised surfaces, #0B1220 for darker page background
              gray: {
                50: '#f8fafc',
                100: '#f1f5f9',
                200: '#e2e8f0',
                300: '#cbd5e1',
                400: '#94a3b8',
                500: '#64748b',
                600: '#3b4d6b',
                700: '#253550',
                750: '#1d2b42',
                800: '#172235', // Deep slate navy - Main raised surfaces
                850: '#111a2b',
                900: '#0B1220', // Darker shade page background
                950: '#060a12',
              },
              slate: {
                700: '#253550',
                750: '#1d2b42',
                800: '#172235', // Deep slate navy - Main raised surfaces
                850: '#111a2b',
                900: '#0B1220', // Darker shade page background
                950: '#060a12',
              },
              // Electric blue accents for navigation, buttons, and key interactive highlights
              blue: {
                50: '#eff6ff',
                100: '#dbeafe',
                200: '#bfdbfe',
                300: '#93c5fd',
                400: '#60a5fa',
                500: '#2563eb',
                600: '#0066ff', // Electric royal blue
                700: '#0052cc',
                800: '#003d99',
                900: '#0f274a',
              },
              // Vivid emerald green for offer values and financial highlights
              emerald: {
                50: '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                300: '#6ee7b7',
                400: '#34d399',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
              },
              green: {
                50: '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                300: '#6ee7b7',
                400: '#10b981', // Vivid emerald green mapped to green-400 for financial offers
                500: '#059669',
                600: '#10b981', // Vivid emerald green
                700: '#047857',
                800: '#065f46',
                900: '#064e3b',
              },
              electric: {
                DEFAULT: '#629AFF',
                500: '#629AFF',
                glow: 'rgba(98, 154, 255, 0.28)',
              }
            },
            boxShadow: {
              'subtle-glow': '0 4px 20px -2px rgba(0, 102, 255, 0.15)',
              'emerald-glow': '0 4px 20px -2px rgba(16, 185, 129, 0.2)',
              'electric-glow': '0 0 18px 0 rgba(98, 154, 255, 0.28)',
            }
          }
        }
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
      body { 
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif; 
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8fafc;
      }
      .dark body {
        background-color: #0B1220;
      }
      /* Custom scrollbar for deep slate navy theme */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
      .dark ::-webkit-scrollbar-track { background: #0B1220; }
      .dark ::-webkit-scrollbar-thumb { background: #172235; border-radius: 4px; border: 1px solid #253550; }
      .dark ::-webkit-scrollbar-thumb:hover { background: #253550; }

      /* Interactive Cards styling: muted slate border normally -> bright electric blue #629AFF + faint blue halo + slightly stronger soft shadow on hover */
      .interactive-card {
        border-color: #cbd5e1;
        box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.05);
        transition: border-color 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .interactive-card:hover {
        border-color: #629AFF !important;
        box-shadow: 0 0 0 1px #629AFF, 0 0 12px 1px rgba(98, 154, 255, 0.18), 0 8px 16px -4px rgba(0, 0, 0, 0.10) !important;
      }
      .dark .interactive-card {
        border-color: #253550;
        box-shadow: 0 4px 8px -2px rgba(0, 0, 0, 0.25);
      }
      .dark .interactive-card:hover {
        border-color: #629AFF !important;
        box-shadow: 0 0 0 1px #629AFF, 0 0 12px 1px rgba(98, 154, 255, 0.20), 0 10px 18px -4px rgba(0, 0, 0, 0.40) !important;
      }
    </style>
    <script>
      // Initialize theme on load
      try {
        const savedTheme = localStorage.getItem('azre-theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        // Force dark mode if no preference is saved, or if saved is dark/system
        if (!savedTheme || savedTheme === 'dark' || (savedTheme === 'system' && systemDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>

  }
}
</script>
